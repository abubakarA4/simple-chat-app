<!DOCTYPE html>
<html>

<head>
    <title>Realtime Chat</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #111b21;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #app {
            width: 420px;
            height: 700px;
            background: #0b141a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        #header {
            background: #202c33;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 70%;
            font-size: 14px;
        }

        .sent {
            background: #005c4b;
            color: white;
            align-self: flex-end;
        }

        .received {
            background: #202c33;
            color: white;
            align-self: flex-start;
        }

        #inputArea {
            display: flex;
            padding: 10px;
            background: #202c33;
        }

        #message {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 20px;
            outline: none;
        }

        #sendBtn {
            margin-left: 10px;
            background: #00a884;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="app">

        <div id="header">
            Realtime Chat
        </div>

        <div id="messages"></div>

        <div id="inputArea">
            <input id="message" placeholder="Type a message">
            <button id="sendBtn">Send</button>
        </div>

    </div>

    <script>

        const socket = io();

        const sendBtn = document.getElementById("sendBtn");
        const input = document.getElementById("message");
        const messages = document.getElementById("messages");

        const username = prompt("Enter your name");

        sendBtn.addEventListener("click", sendMessage);

        function sendMessage() {

            const msg = input.value;

            if (msg.trim() === "") return;

            socket.emit("chat message", {
                user: username,
                text: msg
            });

            input.value = "";
        }

        socket.on("chat message", function (data) {

            const div = document.createElement("div");

            div.classList.add("message");

            if (data.user === username) {
                div.classList.add("sent");
            } else {
                div.classList.add("received");
            }

            div.textContent = data.user + ": " + data.text;

            messages.appendChild(div);

            messages.scrollTop = messages.scrollHeight;

        });

    </script>

</body>

</html>
