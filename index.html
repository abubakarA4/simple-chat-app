<!DOCTYPE html>
<html>

<head>
    <title>Simple Chat</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #ece5dd;
        }

        #chat {
            width: 400px;
            margin: auto;
            margin-top: 50px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        #messages {
            list-style: none;
            padding: 0;
            height: 300px;
            overflow-y: auto;
        }

        #messages li {
            padding: 8px;
            margin: 5px;
            background: #dcf8c6;
            border-radius: 5px;
        }

        #inputArea {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        #message {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px;
            background: #25d366;
            border: none;
            color: white;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <div id="chat">

        <h2>Simple Chat</h2>

        <ul id="messages"></ul>

        <div id="inputArea">
            <input id="message" placeholder="Type message">
            <button id="sendBtn">Send</button>
        </div>

    </div>

    <script>

        const socket = io();

        const sendBtn = document.getElementById("sendBtn");
        const input = document.getElementById("message");
        const messages = document.getElementById("messages");

        sendBtn.addEventListener("click", sendMessage);

        function sendMessage() {

            const msg = input.value;

            if (msg.trim() === "") return;

            socket.emit("chat message", msg);

            input.value = "";
        }

        socket.on("chat message", function (msg) {

            const li = document.createElement("li");

            li.textContent = msg;

            messages.appendChild(li);

            messages.scrollTop = messages.scrollHeight;

        });

    </script>

</body>

</html>
