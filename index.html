<!DOCTYPE html>
<html>

<head>

    <title>WhatsApp Style Chat</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #ece5dd;
        }

        .chat {
            width: 400px;
            height: 650px;
            margin: auto;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .header {
            background: #075e54;
            color: white;
            padding: 15px;
        }

        .status {
            font-size: 12px;
            opacity: 0.8;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #e5ddd5;
        }

        .msg {
            margin: 10px 0;
        }

        .me {
            text-align: right;
        }

        .bubble {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 10px;
            background: white;
            max-width: 65%;
        }

        .me .bubble {
            background: #dcf8c6;
        }

        img {
            max-width: 200px;
            border-radius: 8px;
            margin-top: 5px;
        }

        .typing {
            font-size: 12px;
            color: #555;
            margin-left: 10px;
        }

        .input {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 20px;
            outline: none;
        }

        button {
            background: #25d366;
            border: none;
            padding: 10px;
            margin-left: 5px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <div class="chat">

        <div class="header">

            WhatsApp Chat
            <div id="online" class="status">0 users online</div>

        </div>

        <div id="messages" class="messages"></div>

        <div id="typing" class="typing"></div>

        <div class="input">

            <input id="messageInput" placeholder="Type message">

            <input type="file" id="imageInput">

            <button onclick="sendMessage()">➤</button>

        </div>

    </div>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>

    <script>

        const socket = io("http://172.25.22.185:5000");

        let username = prompt("Enter your name")

        const input = document.getElementById("messageInput")

        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                sendMessage()
            }
        })

        input.addEventListener("input", () => {
            socket.emit("typing", username)
        })

        function sendMessage() {

            const text = input.value
            const image = document.getElementById("imageInput").files[0]

            if (image) {

                const formData = new FormData()
                formData.append("image", image)

                fetch("http://localhost:5000/upload", {
                    method: "POST",
                    body: formData
                })
                    .then(res => res.json())
                    .then(data => {

                        socket.emit("chat message", {
                            user: username,
                            text: text,
                            image: data.image
                        })

                    })

            } else {

                socket.emit("chat message", {
                    user: username,
                    text: text
                })

            }

            input.value = ""
            document.getElementById("imageInput").value = ""

        }

        socket.on("chat message", (data) => {

            const box = document.getElementById("messages")

            const div = document.createElement("div")

            div.classList.add("msg")

            if (data.user === username) {
                div.classList.add("me")
            }

            let content = `<div class="bubble"><b>${data.user}</b><br>${data.text}`

            if (data.image) {
                content += `<br><img src="http://localhost:5000/uploads/${data.image}">`
            }

            content += `</div>`

            div.innerHTML = content

            box.appendChild(div)

            box.scrollTop = box.scrollHeight

        })

        socket.on("typing", (name) => {

            const typing = document.getElementById("typing")

            typing.innerText = name + " is typing..."

            setTimeout(() => {
                typing.innerText = ""
            }, 1500)

        })

        socket.on("online users", (count) => {
            document.getElementById("online").innerText = count + " users online"
        })

    </script>

</body>

</html>
